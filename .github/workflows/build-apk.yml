name: Build Fullscreen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Clean Android Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/gtest/exam
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # Fetch picture directly from GTEST repository
          curl -s -L "https://raw.githubusercontent.com/ToXic0784/GTEST/main/icon-512.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          if [ ! -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png ]; then
            curl -s -L "https://raw.githubusercontent.com/ToXic0784/GTEST/main/icon.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          fi
          if [ ! -s app/src/main/res/mipmap-xxhdpi/ic_launcher.png ]; then
            curl -s -L "https://raw.githubusercontent.com/ToXic0784/GTEST/main/logo.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          fi

          # AndroidManifest.xml (Custom Icon, Zero URL Bar, Fullscreen Native)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.gtest.exam">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="GTEST"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">GTEST</string>
          </resources>
          EOF

          # MainActivity.java (Zero ads, zero sliders, clean pure native webview)
          cat << 'EOF' > app/src/main/java/com/gtest/exam/MainActivity.java
          package com.gtest.exam;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;
          import android.view.WindowManager;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                      WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://toxic0784.github.io/GTEST/");
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GTEST"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gtest.exam'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gtest.exam"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Clean Fullscreen APK
        uses: actions/upload-artifact@v4
        with:
          name: GTEST-Fullscreen-APK
          path: app/build/outputs/apk/debug/app-debug.apk
